[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-triage-agent"
version = "0.1.0"
description = "Tool-calling LLM agent that triages synthetic healthcare claim denials, with guardrails, tracing and evaluation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Veeranjan Reddy" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "boto3>=1.34"]
mlflow = ["mlflow>=2.14"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/veeranjanreddy-86/claims-triage-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claims_agent = ["data/*.json", "data/policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["claims_agent"]
